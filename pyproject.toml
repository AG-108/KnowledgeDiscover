[project]
name = "kd"
version = "0.1.0"
description = "Knowledge discover and plotting framework"
readme = "README.md"
requires-python = "==3.10.*"
license = {file = "LICENSE"}

dependencies = [
  "numpy>=1.23,<3",
  "scipy>=1.9,<2",
  "pandas>=1.5,<3",
  "sympy>=1.11,<2",
  "matplotlib>=3.6,<4",
  "psutil>=5.9,<7",
]

[project.optional-dependencies]
dev = [
  "black==24.8.0",
  "pytest>=8",
  "ruff==0.12.12",
]
operon = ["pyoperon==0.6.1; python_version >= '3.10'"]
benchmark = ["gplearn==0.4.2", "scikit-learn==1.6.1"]
neural = ["torch==2.5.1", "tensorboard==2.18.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["kd", "kd.*"]
namespaces = false

[tool.setuptools.package-data]
"kd.dataset" = [
  "data/*.mat",
  "data/*.csv",
  "data/*.npy",
  "data/*.txt",
]
"kd.model.llmsr" = ["LICENSE", "UPSTREAM.md"]
"kd.model.PDENet2.aTEAM" = ["LICENSE"]
"kd.model.discover.config" = ["*.json"]
"kd.model.dso" = ["config/*.json", "task/regression/*.csv"]
"kd.model.eqgpt" = ["data/*.json", "data/*.xlsx"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = '''
/(
  archive
  | kd/dataset/(CYT|DeepSymbolicOptimization|Discover_Green_function|Discovery_of_soild_consititutive|EqGPT|SymbolicGPT|ViscousGravityCurrent|discovery-of-physics-from-data)
  | kd/model/(PDENet2|discover|dso|eqgpt|sga|symbolicgpt)
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "archive",
  "kd/dataset/CYT",
  "kd/dataset/DeepSymbolicOptimization",
  "kd/dataset/Discover_Green_function",
  "kd/dataset/Discovery_of_soild_consititutive",
  "kd/dataset/EqGPT",
  "kd/dataset/SymbolicGPT",
  "kd/dataset/ViscousGravityCurrent",
  "kd/dataset/discovery-of-physics-from-data",
  "kd/model/PDENet2",
  "kd/model/discover",
  "kd/model/dso",
  "kd/model/eqgpt",
  "kd/model/sga",
  "kd/model/symbolicgpt",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"examples/*.py" = ["E402"]
"kd/dataset/__init__.py" = ["E402"]
"kd/model/kd_pdenet.py" = ["E402"]
"tests/test_kd_dso.py" = ["E402"]
"tests/test_kd_eqgpt.py" = ["E402"]
"tests/test_kd_symbolicgpt.py" = ["E402"]
